name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets

  release:
    name: Release build (${{ matrix.target }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: mclauncher
            name: mclauncher-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: mclauncher.exe
            name: mclauncher-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: mclauncher
            name: mclauncher-macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: mclauncher
            name: mclauncher-macos-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        env:
          # Optional: your Mojang-approved Azure application id. Add it as the
          # repository secret MSA_CLIENT_ID and every release build gets
          # Microsoft sign-in without any user setup.
          MC_LAUNCHER_DEFAULT_CLIENT_ID: ${{ secrets.MSA_CLIENT_ID }}
        run: cargo build --release --target ${{ matrix.target }}
      - name: Rename
        shell: bash
        run: cp target/${{ matrix.target }}/release/${{ matrix.artifact }} ${{ matrix.name }}
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}
