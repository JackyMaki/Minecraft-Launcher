[package]
name = "elo-launcher"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Elo Launcher: a fast, open-source Minecraft launcher. Instant start-up, tuned JVM, Quick Play into worlds and servers, every version and loader, full mod catalog."
repository = "https://github.com/JackyMaki/Minecraft-Launcher"

[[bin]]
name = "elo"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui", "dep:egui_extras", "dep:image"]

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "2.12", features = ["json"] }
sha1 = "0.10"
md-5 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "6"
clap = { version = "4", features = ["derive", "env"] }
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde", "clock"], default-features = false }
uuid = { version = "1", features = ["v4"] }
open = "5"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
eframe = { version = "0.31", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "persistence"] }
egui = { version = "0.31", optional = true }
egui_extras = { version = "0.31", optional = true, default-features = false, features = ["image", "file"] }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
